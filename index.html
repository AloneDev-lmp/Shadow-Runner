<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shadow Walker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
:root{--ink:#05070f;--cy:#28f0ff;--mg:#ff2fa6;--gd:#ffc93c;--tx:#dff6ff;--dim:#7d93ad}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--ink);color:var(--tx);font:500 15px "Chakra Petch",system-ui,sans-serif}
[hidden]{display:none!important}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#ui,#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#ui{background:linear-gradient(rgba(5,7,15,.3),rgba(5,7,15,.82))}
#ov{background:rgba(5,7,15,.78);backdrop-filter:blur(6px)}
.win,.box{display:flex;flex-direction:column;background:rgba(10,16,34,.94);border:1px solid rgba(40,240,255,.45);box-shadow:0 0 50px rgba(40,240,255,.12);border-radius:14px;overflow:hidden;max-height:100%}
.win{width:min(900px,100%);height:min(640px,100%)}
.box{width:min(420px,100%);padding:26px;gap:14px;text-align:center}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 8px;flex-wrap:wrap}
h1{font-size:clamp(26px,5.5vw,46px);letter-spacing:.14em;font-weight:700;color:#eafcff;text-shadow:-2px 0 var(--mg),2px 0 var(--cy);line-height:1}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.chip{border:1px solid rgba(255,201,60,.5);color:var(--gd);padding:6px 14px;border-radius:99px;font-weight:700}
.tabs{display:flex;border-bottom:1px solid rgba(40,240,255,.2);overflow-x:auto;padding:0 12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:600 15px inherit;padding:12px 16px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--cy);border-color:var(--cy)}
.body{flex:1;overflow-y:auto;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
.ft{display:flex;gap:10px;padding:10px 20px;border-top:1px solid rgba(40,240,255,.15)}
.card{border:1px solid rgba(40,240,255,.3);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:rgba(5,7,15,.5)}
.card.lock{opacity:.5}.card small{color:var(--dim)}.card h3{font-size:18px}.card p{color:var(--dim);font-size:13px}
.st{color:var(--gd);letter-spacing:.2em;font-size:18px}
.btn{font:700 15px inherit;color:var(--tx);background:rgba(40,240,255,.12);border:1px solid var(--cy);border-radius:8px;padding:10px 16px;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:rgba(40,240,255,.3);box-shadow:0 0 18px rgba(40,240,255,.4)}
.btn.mg{border-color:var(--mg);background:rgba(255,47,166,.14)}.btn.mg:hover:not(:disabled){background:rgba(255,47,166,.32);box-shadow:0 0 18px rgba(255,47,166,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.pips{display:flex;gap:4px}.pips i{flex:1;height:5px;border-radius:3px;background:#1a2540}.pips i.f{background:var(--cy)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row b{color:var(--cy)}.big{font-size:32px;font-weight:700;letter-spacing:.06em}.col{display:flex;flex-direction:column;gap:10px}
#pz{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 16px}
#touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none}
#touch div{display:flex;gap:10px}
#touch button{pointer-events:auto;touch-action:none;width:58px;height:58px;border-radius:50%;background:rgba(10,16,34,.7);border:1px solid var(--cy);color:var(--cy);font:700 13px inherit}
#touch button:active{background:rgba(40,240,255,.35)}
#rot{position:absolute;inset:0;background:var(--ink);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9;color:var(--cy);font-size:18px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.box{overflow-y:auto}.ft{flex-wrap:wrap}
@media (max-height:520px){#ui{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}.win{height:100%}.hd{padding:8px 14px 4px;flex-wrap:nowrap}h1{font-size:24px}.sub{font-size:11px;margin-top:2px}.chip{padding:3px 10px;font-size:13px}.tabs button{padding:7px 12px;font-size:13px}.body{padding:10px 14px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.card{padding:10px;gap:4px}.card h3{font-size:15px}.card p{font-size:11px}.st{font-size:14px}.btn{padding:6px 12px;font-size:13px}.ft{padding:6px 14px;gap:8px}.box{padding:14px;gap:8px}.box .big{font-size:22px}.row{padding:4px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<button id="pz" class="btn" hidden aria-label="Pause">Pause</button>
<div id="touch" hidden><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="d">Slide</button><button data-k="x">Dash</button><button data-k="j">Jump</button></div></div>
<div id="ui"></div><div id="ov" hidden></div>
<div id="rot">Rotate your device to landscape to play.</div>
<script>
const W=960,H=640,$=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
let SC=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=devicePixelRatio||1;cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*d;cv.height=H*s*d;SC=s*d}
addEventListener('resize',fit);fit();
/* ---------- data ---------- */
const LV=[
{n:'Alleyway',spd:.012,par:60,p:[[120,110,220],[160,150,140,22],[390,180,180],[220,270,180],[450,340,200],[760,220,160]],c:[[230,122],[480,210],[300,300],[530,370]],e:[800,280]},
{n:'Rooftops',spd:.016,par:45,p:[[90,120,150],[290,200,240],[340,240,140,22],[580,280,180],[360,370,200],[120,430,180],[740,420,170]],c:[[150,150],[410,212],[650,310],[200,460]],e:[790,478]},
{n:'Ventilation',spd:.02,par:40,p:[[100,130,140],[290,220,160],[320,260,100,22],[500,310,180],[260,400,200],[300,440,120,22],[540,490,180]],c:[[160,160],[360,232],[570,340],[350,452]],e:[640,548]},
{n:'Cyber core',spd:.025,par:40,p:[[120,140,150],[320,220,180],[360,260,100,22],[550,320,160],[320,420,200],[750,240,160]],c:[[180,170],[410,232],[610,350],[410,450]],e:[790,298]},
{n:'Shadow tower',spd:.03,par:45,p:[[90,120,120],[250,200,130],[420,280,140],[450,320,80,22],[230,380,150],[430,480,200],[120,530,160]],c:[[140,150],[300,230],[480,292],[290,410],[500,510]],e:[170,588]}];
const SKINS=[{id:'cy',n:'Cyber runner',c:'#28f0ff',$:0},{id:'ph',n:'Shadow ghost',c:'#b026ff',$:100},{id:'sa',n:'Cyber samurai',c:'#ff2a5f',$:200}];
const UP={cloak:['Shadow cloak','Exposure builds more slowly in light.',20,l=>'Exposure rate -'+Math.round((1-Math.max(.3,1-l*.12))*100)+'%'],spd:['Hyper sprinter','Run and dash faster.',25,l=>'Run speed +'+Math.round(l*.4/4.6*100)+'%'],mag:['Crystal magnet','Pull crystals from farther away.',15,l=>'Pickup range '+(30+l*25)+' px'],reg:['Dash recharge','Refill dash energy faster in shadow.',20,l=>'Dash recharge +'+l*40+'%']};
/* ---------- save ---------- */
let S={crystals:0,unlocked:1,skin:'cy',skins:['cy'],up:{},best:{},sound:true,music:true,tab:'sec'};
try{const r=localStorage.getItem('SW4');if(r)Object.assign(S,JSON.parse(r));else{const o=JSON.parse(localStorage.getItem('SHADOW_WALKER_SAVE_V3')||'null');if(o){S.crystals=o.crystals||0;S.unlocked=o.unlockedSectors||1}}}catch(e){}
const save=()=>{try{localStorage.setItem('SW4',JSON.stringify(S))}catch(e){}};
const skin=()=>SKINS.find(k=>k.id==S.skin)||SKINS[0],ul=k=>S.up[k]||0,fmt=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60|0).padStart(2,'0');
/* ---------- audio ---------- */
let ac,step=0;
function A(){if(!ac)try{ac=new(window.AudioContext||webkitAudioContext)()}catch(e){}ac&&ac.state=='suspended'&&ac.resume()}
function tone(a,b,d,ty='sine',v=.14){if(!ac||!S.sound)return;const o=ac.createOscillator(),x=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);x.gain.setValueAtTime(v,t);x.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(x);x.connect(ac.destination);o.start();o.stop(t+d)}
setInterval(()=>{if(!ac||!S.music||!S.sound||G.st=='pause')return;const n=[110,110,165,131,98,98,147,131][step++%8];tone(n,n,.24,'triangle',.07);if(step%2)tone(n*4,n*4,.07,'square',.012)},240);
/* ---------- state ---------- */
const G={st:'menu',lv:0,score:0,earn:0,t:0,exp:0,en:100,cr:0,shake:0,la:0,lx:W/2,cd:0,lit:false,pt:[],sh:[]};
const P={x:0,y:0,w:20,h:32,vx:0,vy:0,gr:0,cr:0,dash:0,j:2,f:1,coy:0,buf:0,tr:[]};
let PL=[],CR=[],EX={},dashReq=0;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function load(i){const l=LV[i];G.lv=i;G.exp=0;G.en=100;G.t=0;G.cr=0;G.earn=0;G.pt=[];G.la=0;G.cd=100;
 PL=[{x:0,y:H-35,w:W,h:35},{x:0,y:0,w:25,h:H},{x:W-25,y:0,w:25,h:H},...l.p.map(([x,b,w,h=25])=>({x,y:H-b,w,h}))];
 CR=l.c.map(([x,b])=>({x,y:H-b,got:0}));EX={x:l.e[0],y:H-l.e[1],w:36,h:55};
 Object.assign(P,{x:60,y:H-100,vx:0,vy:0,h:32,cr:0,dash:0,j:2,coy:0,buf:0,tr:[]});shadows()}
function play(i){A();G.score=0;load(i);G.st='play';$('#ui').hidden=$('#ov').hidden=true;$('#pz').hidden=false;$('#touch').hidden=!matchMedia('(pointer:coarse)').matches}
function burst(x,y,c,n=6){for(let i=0;i<n;i++)G.pt.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1,d:.03+Math.random()*.03,c})}
function shadows(){const L={x:G.lx,y:40};G.sh=[];for(const q of PL){const v=[[q.x,q.y],[q.x+q.w,q.y],[q.x+q.w,q.y+q.h],[q.x,q.y+q.h]];for(let i=0;i<4;i++){const a=v[i],b=v[(i+1)%4],pr=p=>{const t=Math.atan2(p[1]-L.y,p[0]-L.x);return[p[0]+Math.cos(t)*2200,p[1]+Math.sin(t)*2200]};G.sh.push([a,b,pr(b),pr(a)])}}}
function inPoly(x,y,v){let r=0;for(let i=0,j=v.length-1;i<v.length;j=i++){const[xi,yi]=v[i],[xj,yj]=v[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)r=!r}return r}
/* ---------- input ---------- */
const I={l:0,r:0,d:0},KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyS:'d',ArrowDown:'d'},JK=['KeyW','Space','ArrowUp'];
const press=()=>{if(G.st=='play')P.buf=7},rel=()=>{if(P.vy<-4)P.vy*=.55};
addEventListener('keydown',e=>{A();if(e.repeat)return;if(KM[e.code])I[KM[e.code]]=1;if(JK.includes(e.code)){e.preventDefault();press()}
 if(e.code.startsWith('Shift'))dashReq=1;if(e.code=='Escape'||e.code=='KeyP')pause();if(e.code=='KeyR'&&G.st=='play')play(G.lv)});
addEventListener('keyup',e=>{if(KM[e.code])I[KM[e.code]]=0;if(JK.includes(e.code))rel()});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();A();k=='j'?press():k=='x'?dashReq=1:I[k]=1});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{k=='j'?rel():k!='x'&&(I[k]=0)}))});
addEventListener('blur',()=>pause(1));
function pause(auto){if(G.st=='play'){G.st='pause';I.l=I.r=I.d=0;ov(`<h1 style="font-size:32px">Paused</h1><p class="sub">${LV[G.lv].n}</p><button class="btn" data-a="resume">Resume</button><button class="btn" data-a="retry">Restart sector</button><button class="btn mg" data-a="menu">Main menu</button>`)}else if(G.st=='pause'&&!auto)resume()}
function resume(){$('#ov').hidden=true;G.st='play'}
/* ---------- physics ---------- */
function phys(){const sp=ul('spd'),base=4.6+sp*.4;
 if(I.d){if(!P.cr){P.cr=1;P.h=16;P.y+=16;tone(140,70,.18,'sawtooth',.1);burst(P.x+10,P.y+16,'#ff2fa6',4)}}
 else if(P.cr){const b={x:P.x,y:P.y-16,w:P.w,h:32};if(!PL.some(q=>hit(b,q))){P.cr=0;P.h=32;P.y-=16}}
 const a=P.cr?base*1.15:base;
 if(I.l){P.vx=-a;P.f=-1}else if(I.r){P.vx=a;P.f=1}else P.vx*=P.cr?.92:.7;
 if(dashReq){dashReq=0;if(G.en>=30&&!P.dash){P.dash=10;G.en-=30;tone(700,180,.2,'sine',.2);G.shake=4;burst(P.x+10,P.y+P.h/2,skin().c,10)}}
 if(P.buf>0){P.buf--;if(P.coy>0){P.coy=0;P.j=1;P.buf=0;jump()}else if(P.j>0&&!P.gr){P.j--;P.buf=0;jump()}}
 if(P.dash){P.vx=P.f*(14+sp*.8);P.vy=0;P.dash--}else P.vy+=.58;
 P.x+=P.vx;for(const q of PL)if(hit(P,q)){P.x=P.vx>0?q.x-P.w:q.x+q.w;P.vx=0}
 P.y+=P.vy;P.gr=0;for(const q of PL)if(hit(P,q)){if(P.vy>0){P.y=q.y-P.h;P.gr=1;if(P.vy>7)burst(P.x+10,P.y+P.h,'#7d93ad',3)}else P.y=q.y+q.h;P.vy=0}
 if(P.gr){P.coy=6;P.j=2}else if(P.coy>0&&--P.coy==0&&P.j==2)P.j=1;
 P.tr.unshift({x:P.x,y:P.y,w:P.w,h:P.h});P.tr.length=Math.min(P.tr.length,5)}
function jump(){P.vy=-11.2;tone(200,500,.12,'triangle',.18);burst(P.x+10,P.y+P.h,skin().c,5)}
function update(){
 if(G.st=='menu'||G.st=='end'){G.la+=.01;G.lx=W/2+Math.sin(G.la)*W*.38;shadows();return}
 if(G.st!='play')return;
 if(G.cd>0){G.cd--;return}
 G.t+=1/60;G.shake*=.88;G.la+=LV[G.lv].spd;G.lx=W/2+Math.sin(G.la)*W*.38;shadows();phys();
 G.pt.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=p.d});G.pt=G.pt.filter(p=>p.l>0);
 const cx=P.x+P.w/2,cy=P.y+P.h/2;G.lit=!G.sh.some(v=>inPoly(cx,cy,v));
 if(G.lit&&!P.dash){G.exp+=1.4*Math.max(.3,1-ul('cloak')*.12);if(G.exp>30&&(G.t*60|0)%12==0)tone(500+G.exp*6,500+G.exp*6,.08,'square',.05);if(G.exp>=100)return fail()}
 else G.exp=Math.max(0,G.exp-1.2);
 if(!G.lit)G.en=Math.min(100,G.en+.25+ul('reg')*.1);
 const md=30+ul('mag')*25;
 for(const c of CR)if(!c.got){const dx=cx-c.x,dy=cy-c.y,d=Math.hypot(dx,dy);if(d<md){c.x+=dx/d*4;c.y+=dy/d*4}
  if(d<22){c.got=1;G.cr++;S.crystals+=5;G.earn+=5;G.score+=250;tone(600,900,.2,'sine',.18);burst(c.x,c.y,'#ffc93c',10);save()}}
 if(hit(P,EX))win()}
function fail(){G.st='end';tone(220,50,.5,'sawtooth',.25);G.shake=14;$('#pz').hidden=$('#touch').hidden=true;
 ov(`<h1 style="font-size:30px;color:var(--mg)">You were spotted</h1><p class="sub">The searchlight caught you in sector ${G.lv+1}.${G.earn?' You kept ◆ '+G.earn+'.':''}</p><button class="btn" data-a="retry">Try again</button><button class="btn mg" data-a="menu">Main menu</button>`)}
function win(){G.st='end';const l=LV[G.lv],i=G.lv,s=G.t<l.par?3:G.t<l.par*1.7?2:1,sc=1000+G.cr*250+Math.max(0,Math.round((l.par*2-G.t)*20));
 const b=S.best[i],bonus=s*10+(b?0:25);S.crystals+=bonus;if(!b||sc>b.sc)S.best[i]={s:Math.max(s,b?b.s:0),sc,t:G.t};else b.s=Math.max(b.s,s);
 if(i+1>=S.unlocked&&i+1<LV.length)S.unlocked=i+2;save();tone(500,1000,.4,'sine',.2);$('#pz').hidden=$('#touch').hidden=true;
 ov(`<h1 style="font-size:30px;color:var(--cy)">Sector cleared</h1><div class="st big">${'★'.repeat(s)+'☆'.repeat(3-s)}</div><div><div class="row"><span>Time</span><b>${fmt(G.t)}</b></div><div class="row"><span>Crystals</span><b>${G.cr}/${CR.length}</b></div><div class="row"><span>Earned</span><b>◆ +${G.earn+bonus}</b></div><div class="row"><span>Score</span><b>${sc}</b></div></div>${i+1<LV.length?'<button class="btn" data-a="next">Next sector</button>':'<p class="sub">You cleared every sector. More are coming.</p>'}<button class="btn mg" data-a="menu">Main menu</button>`)}
/* ---------- render ---------- */
const BL=[0,1,2].map(k=>Array.from({length:14},(_,i)=>{const w=50+Math.random()*70,h=120+Math.random()*(200+k*60);return{x:i*(W/12)-40,w,h,k,w2:Array.from({length:6},()=>[Math.random()*(w-8),Math.random()*(h-12),Math.random()<.5?'#28f0ff':Math.random()<.5?'#ff2fa6':'#ffc93c',Math.random()<.35])}}));
function draw(){g.setTransform(SC,0,0,SC,0,0);g.fillStyle='#05070f';g.fillRect(0,0,W,H);g.save();
 if(G.shake>.5)g.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1230');bg.addColorStop(1,'#05070f');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
 BL.forEach((L,k)=>{const o=(G.lx-W/2)*(.015+k*.02);L.forEach(b=>{g.globalAlpha=.25+k*.18;g.fillStyle='#0b1226';g.fillRect(b.x-o,H-b.h,b.w,b.h);
  g.globalAlpha=.7;b.w2.forEach(w=>{if(w[3]){g.fillStyle=w[2];g.fillRect(b.x-o+w[0],H-b.h+w[1],4,5)}})});});g.globalAlpha=1;
 const lg=g.createRadialGradient(G.lx,40,10,G.lx,40,700);lg.addColorStop(0,'rgba(255,255,230,.95)');lg.addColorStop(.2,'rgba(40,240,255,.3)');lg.addColorStop(1,'rgba(40,240,255,0)');g.fillStyle=lg;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(5,7,15,.93)';G.sh.forEach(v=>{g.beginPath();g.moveTo(v[0][0],v[0][1]);for(let i=1;i<4;i++)g.lineTo(v[i][0],v[i][1]);g.fill()});
 PL.forEach(q=>{g.fillStyle='#0a1124';g.fillRect(q.x,q.y,q.w,q.h);g.strokeStyle='rgba(40,240,255,.8)';g.lineWidth=1.5;g.strokeRect(q.x,q.y,q.w,q.h)});
 const tt=performance.now()/300;
 CR.forEach(c=>{if(c.got)return;g.save();g.shadowColor='#ffc93c';g.shadowBlur=12;g.fillStyle='#ffc93c';g.translate(c.x,c.y+Math.sin(tt+c.x)*2);g.rotate(Math.PI/4);g.fillRect(-4,-4,8,8);g.restore()});
 g.save();g.shadowColor='#ff2fa6';g.shadowBlur=16+Math.sin(tt*2)*6;g.strokeStyle='#ff2fa6';g.lineWidth=2.5;g.strokeRect(EX.x,EX.y,EX.w,EX.h);g.fillStyle='rgba(255,47,166,.2)';g.fillRect(EX.x,EX.y,EX.w,EX.h);g.restore();
 G.pt.forEach(p=>{g.globalAlpha=p.l;g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)});g.globalAlpha=1;
 if(G.st=='play'||G.st=='pause'){const k=skin();P.tr.forEach((t,i)=>{g.globalAlpha=.25-i*.045;g.fillStyle=k.c;g.fillRect(t.x,t.y,t.w,t.h)});g.globalAlpha=1;g.save();

  g.fillStyle='#fff';g.fillRect(P.f>0?P.x+P.w-7:P.x+3,P.cr?P.y+3:P.y+7,4,3);g.restore()}

/* ---------- UI ---------- */
function ov(h){$('#ov').innerHTML='<div class="box">'+h+'</div>';$('#ov').hidden=false}
function menu(){const t=S.tab;let b='';

 if(t=='skin')b=SKINS.map(k=>{const own=S.skins.includes(k.id);return`<div class="card"><h3 style="color:${k.c}">${k.n}</h3><div style="height:36px;border-radius:8px;border:1px solid ${k.c};background:linear-gradient(135deg,#060a14 55%,${k.c})"></div><p>${own?'Owned':'◆ '+k.$}</p><button class="btn" data-a="skin" data-k="${k.id}" ${!own&&S.crystals<k.$?'disabled':''}>${S.skin==k.id?'Equipped':own?'Equip':S.crystals<k.$?'Need ◆ '+(k.$-S.crystals)+' more':'Buy for ◆ '+k.$}</button></div>`}).join('');
 if(t=='help')b=`<div class="card" style="grid-column:1/-1"><div class="row"><span>Move</span><b>A / D or arrows</b></div><div class="row"><span>Jump, double jump</span><b>W / Space / Up</b></div><div class="row"><span>Slide under low gaps</span><b>S / Down</b></div><div class="row"><span>Shadow dash (safe from light)</span><b>Shift</b></div><div class="row"><span>Pause / restart</span><b>Esc / R</b></div><p>The drone's light sweeps the sector. Stay in the shadows of the walls and platforms, grab crystals, and reach the pink exit. Each crystal is worth ◆ 5, and clearing a sector pays extra for more stars.</p></div>`;
 const sy=$('#ui .body')?.scrollTop||0;$('#ui').innerHTML=`<div class="win"><div class="hd"><div><h1>SHADOW WALKER</h1><div class="sub">Stay in the dark. Reach the exit.</div></div><div class="chip">◆ ${S.crystals}</div></div><div class="tabs">${[['sec','Sectors'],['up','Upgrades'],['skin','Skins'],['help','How to play']].map(([k,n])=>`<button class="${t==k?'on':''}" data-a="tab" data-k="${k}">${n}</button>`).join('')}</div><div class="body">${b}</div><div class="ft"><button class="btn" data-a="snd">Sound: ${S.sound?'on':'off'}</button><button class="btn" data-a="mus">Music: ${S.music?'on':'off'}</button><button class="btn" data-a="fs">Full screen</button></div></div>`;const bd=$('#ui .body');if(bd)bd.scrollTop=sy}

const ACT={play:d=>play(+d.i),tab:d=>{S.tab=d.k;menu()},buy:d=>{const p=UP[d.k][2]*(ul(d.k)+1);if(S.crystals>=p&&ul(d.k)<5){S.crystals-=p;S.up[d.k]=ul(d.k)+1;tone(600,900,.2);save();menu()}},
 skin:d=>{const k=SKINS.find(s=>s.id==d.k);if(!S.skins.includes(k.id)){if(S.crystals<k.$)return;S.crystals-=k.$;S.skins.push(k.id)}S.skin=k.id;save();menu()},
 snd:()=>{S.sound=!S.sound;save();menu()},mus:()=>{S.music=!S.music;save();menu()},fs:()=>{const d=document,e=d.documentElement;try{d.fullscreenElement?d.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}},resume,retry:()=>play(G.lv),next:()=>play(G.lv+1),menu:toMenu};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;A();b.blur();ACT[b.dataset.a](b.dataset)});
$('#pz').addEventListener('click',e=>{e.target.blur();pause()});

/* ---------- loop (fixed 60 Hz) ---------- */
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
